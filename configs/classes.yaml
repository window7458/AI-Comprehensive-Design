# AI-Hub 189 인도보행 Polygon: 26 source classes -> 10 training classes.
#
# source_names : raw annotation classes (id order = the ids already used in converted YOLO labels).
#                Sampling / balancing is done at this fine level, so rare members of a merged class
#                (wheelchair, stroller inside other_vehicle; kiosk, table inside obstacle) are still covered.
# names        : the 10 classes the model is trained and evaluated on.
# map          : training class -> source classes merged into it.
# ignore       : source classes that are dropped (their polygons become background).

source_names:
  0: pole
  1: person
  2: movable_signage
  3: chair
  4: motorcycle
  5: potted_plant
  6: tree_trunk
  7: car
  8: bicycle
  9: bollard
  10: truck
  11: carrier
  12: barricade
  13: stroller
  14: fire_hydrant
  15: table
  16: traffic_sign
  17: traffic_light
  18: traffic_light_controller
  19: kiosk
  20: scooter
  21: bus
  22: stop
  23: power_controller
  24: bench
  25: wheelchair
  26: stairs        # not in Polygon data; from Surface caution_zone via prepare_dataset.py --extra-src

names:
  0: obstacle
  1: car
  2: person
  3: other_vehicle
  4: traffic_light
  5: bus
  6: bicycle
  7: motorcycle
  8: scooter
  9: stairs

map:
  obstacle: [pole, tree_trunk, bollard, movable_signage, potted_plant, bench, power_controller, barricade, stop,
             traffic_light_controller, chair, fire_hydrant, table, kiosk]          # 14 classes, 294,829
  car: [car]                                                                        # 147,132
  person: [person]                                                                  # 47,192
  other_vehicle: [truck, carrier, stroller, wheelchair]                             # 35,379
  traffic_light: [traffic_light]                                                    # 26,799
  bus: [bus]                                                                        # 11,321
  bicycle: [bicycle]                                                                # 10,003
  motorcycle: [motorcycle]                                                          # 9,039
  scooter: [scooter]                                                                # 351  (0.06%)
  stairs: [stairs]      # 0 in Polygon data — add AI-Hub Surface with prepare_dataset.py --extra-src

ignore: [traffic_sign]  # 38,918 — unmapped, currently excluded

# Raw label spellings -> source name (lower-cased; spaces are also tried as "_").
aliases:
  potted plant: potted_plant
  tree trunk: tree_trunk
  traffic sign: traffic_sign
  traffic light: traffic_light
  movable signage: movable_signage
  fire hydrant: fire_hydrant
  power controller: power_controller
  traffic light controller: traffic_light_controller
  caution_zone/stairs: stairs     # Surface: label caution_zone with attribute "stairs"
  caution_zone_stairs: stairs

# Fine-tuning focus (source-class names -> priority weight, others = 1).
# The student starts from COCO weights, so classes COCO never had (scooter, pole, bollard, kiosk,
# wheelchair ...) and the safety-critical traffic_light get a bigger quota (min-per-class x weight)
# and stronger repeat-factor sampling. COCO classes (car, person, bus, bicycle, motorcycle, truck,
# bench, chair, potted_plant, fire_hydrant, table) stay at 1. `make_subset.py --no-focus` disables it.
focus_weights:
  scooter: 3.0                    # not in COCO, 351 instances
  traffic_light: 2.0              # in COCO but safety-critical for crossing
  wheelchair: 2.0                 # not in COCO
  stroller: 2.0                   # not in COCO
  carrier: 2.0                    # not in COCO
  kiosk: 2.0                      # not in COCO
  pole: 1.5                       # not in COCO (already very frequent)
  bollard: 1.5                    # not in COCO
  tree_trunk: 1.5                 # not in COCO
  movable_signage: 1.5            # not in COCO
  barricade: 1.5                  # not in COCO
  power_controller: 1.5           # not in COCO
  traffic_light_controller: 1.5   # not in COCO
  stop: 1.5                       # bus stop, not in COCO
  stairs: 3.0                     # not in COCO; only present once Surface data is added

# Every photo containing one of these source classes is used (train/val/test of its sequence),
# on top of the image budget. traffic_light alone is ~11k photos, so the pilot budget grows.
# `make_subset.py --no-include-all` turns it off.
include_all: [scooter, stairs, traffic_light, wheelchair, stroller, carrier, kiosk]

# Reported as separate means in the summary (training-class names).
key_classes: [obstacle, car, person, traffic_light, bus, bicycle, motorcycle]   # walking-safety core classes
rare_classes: [scooter, motorcycle, bicycle, bus]                                # < 2% of instances
focus_classes: [scooter, traffic_light, stairs, obstacle, other_vehicle]         # fine-tuning focus (non-COCO)
