# AI-Hub 189 인도보행 Polygon: 26 source classes -> 10 training classes.
#
# source_names : raw annotation classes (id order = the ids already used in converted YOLO labels).
#                Sampling / balancing is done at this fine level, so rare members of a merged class
#                (wheelchair, stroller inside other_vehicle; kiosk, table inside obstacle) are still covered.
# names        : the 10 classes the model is trained and evaluated on.
# map          : training class -> source classes merged into it.
# ignore       : source classes that are dropped (their polygons become background).

source_names:
  0: pole
  1: person
  2: movable_signage
  3: chair
  4: motorcycle
  5: potted_plant
  6: tree_trunk
  7: car
  8: bicycle
  9: bollard
  10: truck
  11: carrier
  12: barricade
  13: stroller
  14: fire_hydrant
  15: table
  16: traffic_sign
  17: traffic_light
  18: traffic_light_controller
  19: kiosk
  20: scooter
  21: bus
  22: stop
  23: power_controller
  24: bench
  25: wheelchair

names:
  0: obstacle
  1: car
  2: person
  3: other_vehicle
  4: traffic_light
  5: bus
  6: bicycle
  7: motorcycle
  8: scooter
  9: stairs

map:
  obstacle: [pole, tree_trunk, bollard, movable_signage, potted_plant, bench, power_controller, barricade, stop,
             traffic_light_controller, chair, fire_hydrant, table, kiosk]          # 14 classes, 294,829
  car: [car]                                                                        # 147,132
  person: [person]                                                                  # 47,192
  other_vehicle: [truck, carrier, stroller, wheelchair]                             # 35,379
  traffic_light: [traffic_light]                                                    # 26,799
  bus: [bus]                                                                        # 11,321
  bicycle: [bicycle]                                                                # 10,003
  motorcycle: [motorcycle]                                                          # 9,039
  scooter: [scooter]                                                                # 351  (0.06%)
  stairs: []            # 0 in Polygon data — comes from Surface caution_zone, not added yet

ignore: [traffic_sign]  # 38,918 — unmapped, currently excluded

# Raw label spellings -> source name (lower-cased; spaces are also tried as "_").
aliases:
  potted plant: potted_plant
  tree trunk: tree_trunk
  traffic sign: traffic_sign
  traffic light: traffic_light
  movable signage: movable_signage
  fire hydrant: fire_hydrant
  power controller: power_controller
  traffic light controller: traffic_light_controller

# Reported as separate means in the summary (training-class names).
key_classes: [obstacle, car, person, traffic_light, bus, bicycle, motorcycle]   # walking-safety core classes
rare_classes: [scooter, motorcycle, bicycle, bus]                                # < 2% of instances
